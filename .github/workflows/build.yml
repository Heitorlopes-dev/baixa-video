name: build

# Gera os instaladores assinados para a atualização automática:
# Windows (.exe, NSIS) e Linux (AppImage), cada um no seu runner, e um job
# final que junta as duas plataformas no latest.json que o app consulta.
# - Em push de tag v*: cria a Release com os instaladores e o latest.json.
#   A tag precisa ser v + a versão do src-tauri/tauri.conf.json (o script confere).
# - Manualmente (workflow_dispatch): só deixa os arquivos como artefato.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - name: Testes e tipos
        run: |
          bun test
          bun run check-types

      - name: Baixa yt-dlp, ffmpeg, ffprobe e deno
        shell: bash
        run: scripts/fetch-sidecars.sh x86_64-pc-windows-msvc

      - name: Build do instalador (assinado)
        run: bun run tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Instalador com nome fixo
        run: bun scripts/release-files.ts windows-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/
          if-no-files-found: error

  linux:
    # 22.04 de propósito: o AppImage leva a glibc da máquina que compilou como
    # mínimo, então compilar numa versão antiga faz ele rodar em mais distribuições.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do Tauri no Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - name: Testes e tipos
        run: |
          bun test
          bun run check-types

      - name: Baixa yt-dlp, ffmpeg, ffprobe e deno
        run: scripts/fetch-sidecars.sh x86_64-unknown-linux-gnu

      - name: Build do AppImage (assinado)
        run: bun run tauri build --bundles appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: AppImage com nome fixo
        run: bun scripts/release-files.ts linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/
          if-no-files-found: error

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/download-artifact@v4
        with:
          path: release/
          merge-multiple: true

      - name: latest.json com as duas plataformas
        run: bun scripts/release-manifest.ts

      - uses: actions/upload-artifact@v4
        with:
          name: baixa-video
          path: release/
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
