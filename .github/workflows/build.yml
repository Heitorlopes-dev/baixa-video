name: build

# Gera os instaladores assinados para a atualização automática:
# Windows (.exe, NSIS), Linux (AppImage) e Android (APK), cada um no seu runner,
# e um job final que junta tudo no latest.json que os apps consultam.
# - Em push de tag v*: cria a Release com os instaladores e o latest.json.
#   A tag precisa ser v + a versão do src-tauri/tauri.conf.json (o script confere).
# - Em push na main: build completo sem publicar. Serve de CI de tudo que entra
#   na main e deixa o cache de compilação salvo nela: o GitHub só deixa uma tag
#   ler o cache dela mesma ou o da branch padrão, então sem isto toda release
#   compilava do zero. Push só de *.md não dispara.
# - Manualmente (workflow_dispatch): só deixa os arquivos como artefato.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - name: Testes e tipos
        run: |
          bun test
          bun run check-types

      - name: Baixa yt-dlp, ffmpeg, ffprobe e deno
        shell: bash
        run: scripts/fetch-sidecars.sh x86_64-pc-windows-msvc

      - name: Build do instalador (assinado)
        run: bun run tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Instalador com nome fixo
        run: bun scripts/release-files.ts windows-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/
          if-no-files-found: error

  linux:
    # 22.04 de propósito: o AppImage leva a glibc da máquina que compilou como
    # mínimo, então compilar numa versão antiga faz ele rodar em mais distribuições.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do Tauri no Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - name: Formatação, lint, testes e tipos
        run: |
          bun run format:check
          bun run lint
          bun test
          bun run check-types

      - name: Baixa yt-dlp, ffmpeg, ffprobe e deno
        run: scripts/fetch-sidecars.sh x86_64-unknown-linux-gnu

      - name: Build do AppImage (assinado)
        run: bun run tauri build --bundles appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: AppImage com nome fixo
        run: bun scripts/release-files.ts linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "30.0.16248370"
    steps:
      - uses: actions/checkout@v4

      # Sem a chave, o APK sairia assinado com a chave de depuração: falha antes de tudo.
      - name: Chave de assinatura do APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::secret ANDROID_KEYSTORE_BASE64 ausente: o APK não pode ser assinado"; exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/baixa-video.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/baixa-video.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: src-tauri/gen/android/**/*.gradle*

      - uses: android-actions/setup-android@v3

      - name: SDK e NDK do Android
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - name: QuickJS-NG para o APK
        run: scripts/fetch-sidecars.sh aarch64-linux-android

      - name: Build do APK (assinado)
        run: bun run tauri android build --apk --target aarch64
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: baixa-video

      - name: APK com nome fixo
        run: bun scripts/release-files.ts android-aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release/
          if-no-files-found: error

  publish:
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/download-artifact@v4
        with:
          path: release/
          merge-multiple: true

      - name: latest.json com as duas plataformas
        run: bun scripts/release-manifest.ts

      - uses: actions/upload-artifact@v4
        with:
          name: baixa-video
          path: release/
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
