name: build

# Gera o instalador .exe num runner Windows.
# - Em push de tag v*: cria a Release no GitHub com o instalador anexado.
# - Manualmente (workflow_dispatch): só deixa o instalador como artefato do job.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - name: Testes e tipos
        run: |
          bun test
          bun run check-types

      - name: Baixa yt-dlp, ffmpeg e ffprobe
        shell: bash
        run: scripts/fetch-sidecars.sh x86_64-pc-windows-msvc

      - name: Build do instalador
        run: bun run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: baixa-video-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
